name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Check release version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package version must match'
      - name: Install build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"
      - name: Build and check
        run: .\scripts\build-windows.ps1
      - name: Check packaged interface
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $process = Start-Process -FilePath 'dist/Video Downloader/Video Downloader.exe' -ArgumentList @('--smoke-test', ('"' + $reportPath + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Packaged interface timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged interface failed' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (-not $report.ui_ready) { throw 'Packaged interface is not ready' }
      - name: Save build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            dist/Video-Downloader-Windows-x64.zip
            dist/Video-Downloader-Windows-x64.zip.sha256
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: docs/release-notes.md
          files: |
            dist/Video-Downloader-Windows-x64.zip
            dist/Video-Downloader-Windows-x64.zip.sha256
